<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Icons Boostrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Boostrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- SweetAlert2 CSS via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.18.0/dist/sweetalert2.min.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Apple Travel's</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="#inicio">Inicio</a>
                        <a class="nav-link" href="#destinos">Destinos</a>
                        <a class="nav-link" href="#vitrine">Vitrine</a>
                        <a class="nav-link" href="#contato">Contato</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Banner -->
        <section id="inicio">
            <div id="carouselExampleCaptions" class="carousel slide container-fluid mt-4 mb-4">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="./assets/img/BARILOCHE-01.jpeg" class="d-block w-100" alt="Foto paisagem bariloche viagens">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>BARILOCHE</h5>
                            <p>Mirantes incríveis ao longo do Lago Nahuel Huapi.</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="./assets/img/FRANCA-03.jpg" class="d-block w-100" alt="Foto paisagem frança viagens">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>FRANÇA</h5>
                            <p>Sinta a energia da Torre Eiffel e a arte infinita do Louvre.</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="./assets/img/SUICA-02.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block">
                            <h5>SUIÇA</h5>
                            <p> Suba montanhas icônicas como o Titlis ou o Jungfraujoch.</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
        <!-- Destinos -->
        <section id="destinos">
        </section>
        <!-- Galeria -->
        <section id="vitrine">
        </section>
        <!-- Contato -->
        <section id="contato">
        </section>
    </main>

    <!-- Rodapé -->
    <footer></footer>


    <!-- SweetAlert2 JavaScript via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.18.0/dist/sweetalert2.all.min.js" defer></script>

    <!-- Bootstrap JS via CDN JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"
        defer></script>

</body>

</html>
